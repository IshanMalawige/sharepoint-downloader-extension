<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #1f1f1f;
      color: #ffffff;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #218838;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h3>SharePoint Downloader</h3>
  <button id="downloadBtn">Download Video</button>
  <div id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
